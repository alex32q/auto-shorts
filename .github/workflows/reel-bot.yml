```yaml
name: Reel Bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = Test only, 0 = Actual Instagram publish"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"

  # Testing ke baad daily schedule enable karna.
  # schedule:
  #   - cron: "30 2 * * *"
  #   - cron: "30 5 * * *"
  #   - cron: "30 8 * * *"
  #   - cron: "30 11 * * *"
  #   - cron: "0 14 * * *"
  #   - cron: "0 16 * * *"

permissions:
  contents: write

concurrency:
  group: instagram-reel-bot
  cancel-in-progress: false

jobs:
  publish-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: reelbot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reelbot/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          required = [
              "GEMINI_API_KEY",
              "CLOUDINARY_URL",
              "IG_USER_ID",
              "IG_ACCESS_TOKEN",
          ]
          missing = [k for k in required if not os.getenv(k)]
          if missing:
              raise SystemExit(
                  "Missing GitHub Actions secrets: " + ", ".join(missing)
              )
          print("Required secrets are present.")
          PY

      - name: Generate and publish Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u main.py

      - name: Save topic history
        if: ${{ success() && inputs.dry_run != '1' }}
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- reelbot/data/history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reelbot/data/history.json
            git commit -m "Update Reel Bot topic history" || true
            git push
          else
            echo "No topic history changes to commit."
          fi
```
