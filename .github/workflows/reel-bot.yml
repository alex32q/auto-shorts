name: Reel Bot

on:
  # Schedule abhi band hai. Test theek hone ke baad neeche ki 8 lines se "# " hata dena
  # schedule:
  #   - cron: "30 2 * * *"
  #   - cron: "30 5 * * *"
  #   - cron: "30 8 * * *"
  #   - cron: "30 11 * * *"
  #   - cron: "0 14 * * *"
  #   - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = upload nahi, sirf test video banao"
        default: "1"

permissions:
  contents: write

concurrency:
  group: reel-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: reelbot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reelbot/requirements.txt

      - name: Fonts install
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Reel banao aur upload karo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || '0' }}
          USE_VEO: "0"
          IMAGE_BACKEND: pollinations
          TEXT_MODEL: gemini-2.5-flash-lite
        run: python main.py

      - name: Test video save karo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-output
          path: reelbot/output/
          retention-days: 3

      - name: History save karo
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == '1') }}
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add data/history.json || true
          git diff --cached --quiet || (git commit -m "reelbot: update history" && git pull --rebase && git push)
