# Is file ko repo mein is path par rakho: .github/workflows/daily-short.yml
name: daily-short

on:
  schedule:
    - cron: "0 17 * * *"   # roz 17:00 UTC = 1 PM ET / 10 AM PT (video private banega, aap baad mein publish karo)
  workflow_dispatch:        # Actions tab se manually "Run workflow" bhi kar sakte ho

permissions:
  contents: write

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Make video and upload
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: private

      - name: Save video copy (3 din)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: work/final.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Save used topics (repo active bhi rahega)
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add used_topics.txt
          git commit -m "update topics" || exit 0
          git push
